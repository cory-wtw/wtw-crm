# Netlify build settings for the Roster.
#
# Required environment variables (set these in Netlify UI → Site settings →
# Environment variables before the first deploy):
#
#   NEXT_PUBLIC_FIREBASE_API_KEY
#   NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
#   NEXT_PUBLIC_FIREBASE_PROJECT_ID
#   NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
#   NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
#   NEXT_PUBLIC_FIREBASE_APP_ID
#   FIREBASE_ADMIN_CLIENT_EMAIL
#   FIREBASE_ADMIN_PRIVATE_KEY   ← multi-line; Netlify supports newlines in env values

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Next 16 requires Node 20.9+
  NODE_VERSION = "20"

  # Firebase's web client config (apiKey, authDomain, etc.) is designed to be
  # public — Next inlines all NEXT_PUBLIC_* vars into client JS by design, and
  # access control comes from Firebase Auth + Firestore Security Rules.
  # Tell Netlify's secrets scanner not to flag these.
  # The FIREBASE_ADMIN_* vars are NOT listed here — they're real secrets and
  # should be caught if they ever leak into the build output.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_FIREBASE_API_KEY,NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN,NEXT_PUBLIC_FIREBASE_PROJECT_ID,NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET,NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID,NEXT_PUBLIC_FIREBASE_APP_ID"

  # Also disable the "smart" pattern-based detector that flags any string
  # matching the Google API-key shape ("AIza..."). Our apiKey is one of those.
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

# @netlify/plugin-nextjs is auto-installed when Netlify detects a Next.js
# project; pinning it here makes the build deterministic.
[[plugins]]
  package = "@netlify/plugin-nextjs"
