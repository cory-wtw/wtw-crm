# Firebase App Hosting backend config for the Roster.
# Docs: https://firebase.google.com/docs/app-hosting/configure
#
# Runtime credentials for the Admin SDK come from the Cloud Run metadata
# server — no FIREBASE_ADMIN_* env vars needed. The client SDK reads the
# NEXT_PUBLIC_* values below; they're baked into the JS bundle at build
# time, which is why availability is BUILD only.

runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyAbyv5AhyY2H4EvuxMVrfLYjUyoqUVw46w
    availability:
      - BUILD
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: wtw-crm-31aef.firebaseapp.com
    availability:
      - BUILD
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: wtw-crm-31aef
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: wtw-crm-31aef.firebasestorage.app
    availability:
      - BUILD
      # RUNTIME too: server-side media deletes + the purge cron resolve the
      # bucket by name from this var.
      - RUNTIME
  # Shared secret guarding /api/cron/purge-media. Create it once with:
  #   firebase apphosting:secrets:set cron-secret
  # then grant the backend access when prompted.
  - variable: CRON_SECRET
    secret: cron-secret
    availability:
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "259965531521"
    availability:
      - BUILD
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:259965531521:web:dc7f51cbbfde75be092480
    availability:
      - BUILD
